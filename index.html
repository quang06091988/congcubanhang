<style>
:root{--c:#0f9d76;--a:#ffb020;--bg:#eaf2ef;--ink:#10201a;--mu:#5f7168;--ln:#d9e4df;--w:#fff;--rd:#d9382c;--sh:0 8px 28px rgba(10,60,45,.13);--g:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#1457c8));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);background:var(--c)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1512;--ink:#e8f0ec;--mu:#93a69c;--ln:#25322b;--w:#17211c;--sh:0 8px 28px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template:"h h" auto "n m" minmax(0,1fr)/84px 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;position:relative;overflow:hidden;transition:transform .12s,box-shadow .2s,filter .2s}button:active{transform:scale(.95)}button:disabled{opacity:.5}
input,select{background:var(--w);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;width:100%;transition:border-color .2s,box-shadow .2s}input:focus,select:focus{outline:0;border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
header{grid-area:h;background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-100%);animation:shn 6s 1s infinite}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:19px}
#brand{font-weight:800;font-size:18px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
#off{background:var(--a);color:#3a2800;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}#off[hidden],#inst[hidden]{display:none}
#inst{background:#fff;color:var(--c);border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px}
nav{grid-area:n;background:var(--w);display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-right:1px solid var(--ln)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:10px 2px;border-radius:14px;color:var(--mu)}.tab b{font-size:22px;transition:transform .25s}
.tab.on{background:var(--g);color:#fff;box-shadow:var(--sh)}.tab.on b{transform:scale(1.15)}
main{grid-area:m;min-height:0;position:relative}.v{display:none;height:100%;overflow:auto;padding:16px}.v.on{display:block;animation:in .3s}
#v-sell.on{display:grid;grid-template-columns:1fr 380px;gap:0;overflow:hidden;padding:0}
.pane{display:flex;flex-direction:column;min-height:0;padding:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;flex-shrink:0;scrollbar-width:none}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--w);white-space:nowrap;font-weight:600}.chip.on{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow:auto;align-content:start;flex:1;padding:2px}
.it{background:var(--w);border:1px solid var(--ln);border-top:3px solid var(--c);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:84px;animation:pop .25s both}
.it span{color:var(--c);font-weight:700;font-size:14px}.it.so{opacity:.5;border-top-color:var(--ln)}.it i{position:absolute;top:8px;right:10px;font-size:11px;color:var(--rd);font-style:normal;font-weight:700}
@media(hover:hover){.it:hover{transform:translateY(-3px);box-shadow:var(--sh)}}.pop{animation:pop .3s}
.cartp{background:var(--w);border-left:1px solid var(--ln)}.grab{display:none;width:44px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 8px}
#cart{flex:1;overflow:auto}.ln{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 0;border-bottom:1px solid var(--ln);animation:in .2s both}
.q{display:flex;align-items:center;gap:4px}.q button{width:30px;height:30px;border:1px solid var(--ln);border-radius:8px;font-weight:700}.q input{width:60px;text-align:center;padding:4px}
.mu{color:var(--mu)}.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:10px 0}#tt{color:var(--c)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.pri,.ghost,.dng{padding:11px 14px;border-radius:12px;border:1px solid var(--c);font-weight:700}.pri{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}.ghost{color:var(--c)}.dng{color:var(--rd);border-color:var(--rd)}
.card{background:var(--w);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--sh);animation:in .35s both}.card h3{margin-bottom:8px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mu)}label input,label select{color:var(--ink);margin-top:3px}
.li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln);align-items:center;transition:background .2s}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.st div{background:var(--bg);border-radius:12px;padding:10px;color:var(--mu);font-size:13px}.st b{display:block;font-size:19px;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:3px;height:100px}.bars div{flex:1;background:var(--g);border-radius:4px 4px 0 0;min-height:2px;transform-origin:bottom;animation:grow .6s both}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px;border:1px solid var(--ln);border-radius:10px;font-weight:600}.seg .on{background:var(--g);color:#fff;border-color:transparent}
#mo{position:fixed;inset:0;background:rgba(5,20,15,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9;animation:fi .2s}#mo[hidden]{display:none}
#md{background:var(--w);border-radius:20px;padding:18px;width:100%;max-width:460px;max-height:92dvh;overflow:auto;animation:pop .25s cubic-bezier(.2,1.2,.4,1)}#md h3{margin-bottom:10px}#md label{margin-bottom:8px}
#pqr img{width:100%;max-width:260px;display:block;margin:8px auto}.pvb{text-align:center}.pvb img{max-width:100%;max-height:60dvh;border-radius:10px;box-shadow:var(--sh)}.sk{height:300px;border-radius:12px;background:linear-gradient(90deg,var(--ln),var(--bg),var(--ln));background-size:200% 100%;animation:sh 1.1s infinite}
#snk{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;width:min(520px,calc(100% - 24px));background:#12201b;color:#fff;border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;z-index:8;box-shadow:var(--sh);animation:up .3s}#snk[hidden]{display:none}#snk span{margin-right:auto;font-weight:600}#snk button{color:#7ff0c3;font-weight:700}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-10px);background:#12201b;color:#fff;padding:9px 16px;border-radius:99px;z-index:10;opacity:0;transition:.25s;pointer-events:none}#toast.on{opacity:1;transform:translateX(-50%)}
#cbar{display:none;position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--g);color:#fff;border-radius:16px;padding:13px 16px;align-items:center;gap:10px;font-weight:700;z-index:5;box-shadow:var(--sh)}
#cn{background:#fff;color:var(--c);border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 7px}#cbar span:nth-child(2){margin-right:auto}.bmp{animation:bmp .3s}
#fx{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:11}#fx.on{display:grid}#fx div{width:104px;height:104px;background:var(--c);border-radius:50%;animation:pop .45s cubic-bezier(.2,1.4,.4,1),out .3s .8s forwards;box-shadow:0 12px 40px color-mix(in srgb,var(--c) 55%,transparent)}
#fx svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}#fx circle{stroke:none}#fx path{stroke-dasharray:40;stroke-dashoffset:40;animation:dash .4s .25s forwards}
u.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none;text-decoration:none}
@keyframes in{from{opacity:0;transform:translateY(10px)}}@keyframes pop{from{opacity:0;transform:scale(.88)}}@keyframes fi{from{opacity:0}}@keyframes up{from{opacity:0;transform:translate(-50%,20px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes dash{to{stroke-dashoffset:0}}@keyframes out{to{opacity:0;transform:scale(1.25)}}@keyframes bmp{50%{transform:scale(1.05)}}@keyframes sh{to{background-position:-200% 0}}@keyframes shn{to{transform:translateX(100%)}}@keyframes rp{to{transform:scale(2.6);opacity:0}}
body.co #cbar{display:none!important}.row button{white-space:nowrap;padding-left:8px;padding-right:8px}#pv_s{flex:1.5}
#rc{display:none}
@media print{body>*:not(#rc){display:none!important}body{display:block;overflow:visible;background:#fff}#rc{display:block}#rc img{width:58mm}}
@media(min-width:1200px){#v-sell.on{grid-template-columns:1fr 420px}#grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.v{padding:24px 32px}}
@media(max-width:820px){
body{grid-template:"h" auto "m" minmax(0,1fr) "n" auto/1fr}
nav{flex-direction:row;border:0;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}.tab{flex:1;padding:6px 2px}.tab b{font-size:20px}
header{padding:8px 14px}#v-sell.on{grid-template-columns:1fr}#grid{padding-bottom:76px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.cartp{position:fixed;left:0;right:0;bottom:0;max-height:80dvh;border:0;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.28);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1);z-index:7;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}.cartp.open{transform:none}.grab{display:block}
#cbar.on{display:flex}#snk{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>

<header><span class="logo">🧾</span><span id="brand">Bán hàng</span><span id="off" hidden>Offline</span><button id="inst" hidden>⤓ Cài app</button></header>
<nav><button class="tab on" data-v="sell"><b>🛒</b>Bán hàng</button><button class="tab" data-v="prod"><b>📦</b>Hàng hoá</button><button class="tab" data-v="rep"><b>📊</b>Đơn hàng</button><button class="tab" data-v="set"><b>⚙️</b>Cài đặt</button></nav>
<main>
<section class="v on" id="v-sell">
 <div class="pane"><input id="q" placeholder="Tìm hàng…" type="search"><div class="chips" id="chips"></div><div id="grid"></div></div>
 <div class="pane cartp" id="cartp"><div class="grab" id="grab"></div><div id="cart"></div>
  <label>Giảm giá (đ)<input id="disc" inputmode="decimal"></label>
  <div class="tot"><span>Tổng</span><span id="tt">0đ</span></div>
  <div class="row"><button class="pri" id="quick">💵 Thu đủ</button><button class="ghost" id="pay">Thanh toán…</button></div></div>
</section>
<section class="v" id="v-prod"><div class="row" style="margin:0 0 10px"><input id="pq" type="search" placeholder="Tìm hàng hoá…"><button class="pri" style="flex:none" id="padd">+ Thêm</button></div><div class="card" id="plist"></div></section>
<section class="v" id="v-rep"><div class="card"><div class="seg" id="rg"></div></div><div class="card"><div class="st" id="stats"></div><div class="bars" id="bars" style="margin-top:12px"></div></div><div class="card"><h3>Bán chạy</h3><div id="top"></div></div><div class="card"><h3>Đơn hàng</h3><div id="olist"></div></div></section>
<section class="v" id="v-set"><div class="card" id="cfgc"></div><div class="card" id="datac"></div></section>
</main>
<button id="cbar"><span id="cn">0</span><span>Xem giỏ hàng</span><b id="cb">0đ</b></button><div id="fx"></div><div id="snk" hidden></div><div id="mo" hidden><div id="md"></div></div><div id="toast"></div><div id="rc"></div>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n||0).toLocaleString('vi-VN');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim();
const num=v=>{let s=String(v??'').replace(/[^\d.,-]/g,'');if(!s)return NaN;if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else if(/^-?\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');return parseFloat(s)};
const dk=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const tm=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())};
const DEF=()=>({cfg:{name:'',phone:'',addr:'',foot:'',pre:'',color:'#0f9d76',bin:'',bank:'',acc:'',holder:'',round:1000},products:[],orders:[],counter:0,lastBackup:0});
let S=DEF(),DBH=null,cart={},G='',Q='',R='today',last=null,hs;
/* ---- lưu trữ: IndexedDB, toàn bộ dữ liệu nằm trên máy ---- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('ban-hang-local',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function load(){try{DBH=await idb();const v=await new Promise(r=>{const q=DBH.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v)S=Object.assign(DEF(),v,{cfg:Object.assign(DEF().cfg,v.cfg)})}catch(e){DBH=null;toast('Trình duyệt không cho lưu dữ liệu — hãy xuất file sao lưu thường xuyên')}}
function save(){if(DBH)try{DBH.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'s')}catch(e){toast('Không lưu được dữ liệu')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(hs);hs=setTimeout(()=>t.classList.remove('on'),2200)}
function modal(h){$('#md').innerHTML=h;$('#mo').hidden=false}function closeM(){$('#mo').hidden=true}
$('#mo').onclick=e=>{if(e.target.id==='mo')closeM()};
const price=p=>p.sp>0&&p.sp<p.p?p.sp:p.p;
const roundTo=v=>{const s=S.cfg.round>0?S.cfg.round:1;return Math.round(v/s)*s};
function applyCfg(){document.documentElement.style.setProperty('--c',S.cfg.color||'#0f9d76');$('#brand').textContent=S.cfg.name||'Bán hàng';document.title=S.cfg.name||'Công cụ bán hàng'}
function go(v){$$('.v').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));$$('.tab').forEach(e=>e.classList.toggle('on',e.dataset.v===v));({sell:rSell,prod:rProd,rep:rRep,set:rSet})[v]()}
$$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));
/* ---- bán hàng ---- */
function rSell(){const gs=[...new Set(S.products.map(p=>p.g||''))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'vi'));if(G&&!gs.includes(G))G='';
 $('#chips').innerHTML=['',...gs].map(g=>`<button class="chip${g===G?' on':''}" data-g="${esc(g)}">${g?esc(g):'Tất cả'}</button>`).join('');
 const k=norm(Q),ps=S.products.filter(p=>(!G||p.g===G)&&(!k||norm(p.n).includes(k))).sort((a,b)=>(b.f?1:0)-(a.f?1:0)||a.n.localeCompare(b.n,'vi'));
 $('#grid').innerHTML=ps.length?ps.map(p=>`<button class="it${p.so?' so':''}" data-id="${p.id}"><b>${esc(p.n)}</b><span>${fmt(price(p))}đ${p.u?' / '+esc(p.u):''}</span>${p.so?'<i>Hết</i>':''}</button>`).join(''):`<p class="mu">${S.products.length?'Không có hàng phù hợp.':'Chưa có hàng hoá. Vào Hàng hoá để thêm, hoặc Cài đặt → Nhập file.'}</p>`;rCart()}
function tot(){let sub=0;const L=Object.keys(cart).map(id=>{const p=S.products.find(x=>x.id===id);if(!p){delete cart[id];return null}const a=Math.round(cart[id]*price(p));sub+=a;return{p,q:cart[id],a}}).filter(Boolean);const d=Math.min(Math.max(num($('#disc').value)||0,0),sub);return{L,sub,d,t:sub-d}}
function rCart(){const T=tot();$('#cart').innerHTML=T.L.length?T.L.map(l=>`<div class="ln"><b>${esc(l.p.n)}</b><b>${fmt(l.a)}đ</b><span class="mu">${fmt(price(l.p))}đ${l.p.u?' / '+esc(l.p.u):''}</span><div class="q" data-id="${l.p.id}"><button data-a="-">−</button><input value="${l.q}" inputmode="decimal"><button data-a="+">+</button><button data-a="x">✕</button></div></div>`).join(''):'<p class="mu">Giỏ trống — chạm vào hàng để thêm.</p>';cnt($('#tt'),T.t);$('#cn').textContent=Math.round(T.L.reduce((a,l)=>a+l.q,0)*100)/100;$('#cb').textContent=fmt(T.t)+'đ';$('#cbar').classList.toggle('on',T.L.length>0);if(!T.L.length)sheet(false)}
$('#q').oninput=e=>{Q=e.target.value;rSell()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){G=b.dataset.g;rSell()}};
$('#grid').onclick=e=>{const b=e.target.closest('.it');if(!b)return;const p=S.products.find(x=>x.id===b.dataset.id);if(p.so){toast('Mặt hàng đang hết');return}cart[p.id]=(cart[p.id]||0)+1;rCart();bump(b);if(navigator.vibrate)navigator.vibrate(8)};
$('#cart').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.parentNode.dataset.id,a=b.dataset.a;if(a==='x')delete cart[id];else{cart[id]=Math.round((cart[id]+(a==='+'?1:-1))*1000)/1000;if(cart[id]<=0)delete cart[id]}rCart()};
$('#cart').onchange=e=>{if(e.target.tagName!=='INPUT')return;const id=e.target.parentNode.dataset.id,v=num(e.target.value);if(v>0)cart[id]=v;else delete cart[id];rCart()};
$('#disc').oninput=rCart;
function done(method,cash){const T=tot();if(!T.L.length)return;S.counter++;const o={id:uid(),no:(S.cfg.pre||'')+String(S.counter).padStart(5,'0'),ts:Date.now(),items:T.L.map(l=>({i:l.p.id,n:l.p.n,u:l.p.u||'',q:l.q,p:price(l.p)})),sub:T.sub,disc:T.d,amt:T.t,method,cash:method==='cash'?cash:0,change:method==='cash'&&cash>T.t?cash-T.t:0,void:false};
 S.orders.push(o);save();cart={};$('#disc').value='';last=o;rSell();snack(o);fx()}
function snack(o){const s=$('#snk');s.hidden=false;s.innerHTML=`<span>✓ ${esc(o.no)} · ${fmt(o.amt)}đ</span><button onclick="viewR('${o.id}')">Xem</button><button onclick="undo()">Hoàn tác</button>`;clearTimeout(snack.t);snack.t=setTimeout(()=>s.hidden=true,6000)}
function undo(){$('#snk').hidden=true;const o=last;if(!o||o.void)return;o.void=true;save();o.items.forEach(i=>{if(S.products.some(p=>p.id===i.i))cart[i.i]=(cart[i.i]||0)+i.q});rSell();toast('Đã hoàn tác '+o.no)}
$('#quick').onclick=()=>{const T=tot();if(T.L.length)done('cash',T.t)};
$('#pay').onclick=()=>{const T=tot();if(!T.L.length)return;let m='cash';
 modal(`<h3>Thanh toán ${fmt(T.t)}đ</h3><div class="seg"><button id="m1" class="on">Tiền mặt</button><button id="m2">Chuyển khoản</button></div><div id="pc" style="margin-top:10px"><label>Khách đưa (đ)<input id="cg" inputmode="decimal"></label><p>Tiền thối: <b id="ch">0đ</b></p></div><div id="pqr" hidden>${qr(T.t)}</div><div class="row"><button class="ghost" onclick="closeM()">Hủy</button><button class="pri" id="ok">Xác nhận</button></div>`);
 $('#m1').onclick=$('#m2').onclick=e=>{m=e.target.id==='m1'?'cash':'qr';$('#m1').classList.toggle('on',m==='cash');$('#m2').classList.toggle('on',m==='qr');$('#pc').hidden=m!=='cash';$('#pqr').hidden=m!=='qr'};
 $('#cg').oninput=e=>{$('#ch').textContent=fmt(Math.max(0,(num(e.target.value)||0)-T.t))+'đ'};
 $('#ok').onclick=()=>{const c=num($('#cg').value)||0;if(m==='cash'&&c>0&&c<T.t){toast('Khách đưa chưa đủ');return}closeM();done(m,m==='cash'?(c||T.t):0)}};
const crc=t=>{let c=65535;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&32768?(c<<1)^4129:c<<1;c&=65535}return c.toString(16).toUpperCase().padStart(4,'0')},tl=(i,v)=>i+String(v.length).padStart(2,'0')+v;
function vqr(c,amt){const b=String(c.bin).replace(/\s/g,''),a=String(c.acc).replace(/\s/g,''),p=tl('00','01')+tl('01','12')+tl('38',tl('00','A000000727')+tl('01',tl('00',b)+tl('01',a))+tl('02','QRIBFTTA'))+tl('53','704')+tl('54',String(Math.round(amt)))+tl('58','VN')+'6304';return p+crc(p)}
function qrM(txt){const d=[...new TextEncoder().encode(txt)],TB=[[16,10,1,16,0],[28,16,1,28,0],[44,26,1,44,0],[64,18,2,32,0],[86,24,2,43,0],[108,16,4,27,0],[124,18,4,31,0],[154,22,2,38,2],[182,22,3,36,2],[216,26,4,43,1]];
 let v=0;while(v<10&&TB[v][0]*8<4+(v<9?8:16)+8*d.length)v++;if(v>9)throw'long';
 const[DT,EC,B1,D1,B2]=TB[v],bits=[],put=(n,l)=>{for(let i=l-1;i>=0;i--)bits.push((n>>i)&1)};
 put(4,4);put(d.length,v<9?8:16);d.forEach(b=>put(b,8));put(0,Math.min(4,DT*8-bits.length));while(bits.length%8)bits.push(0);
 const cw=[];for(let i=0;i<bits.length;i+=8)cw.push(parseInt(bits.slice(i,i+8).join(''),2));for(let p=0;cw.length<DT;p++)cw.push(p%2?17:236);
 const E=[],L=[];for(let i=0,x=1;i<255;i++){E[i]=x;L[x]=i;x<<=1;if(x>255)x^=285}for(let i=255;i<512;i++)E[i]=E[i-255];const mul=(a,b)=>a&&b?E[L[a]+L[b]]:0;
 let g=[1];for(let i=0;i<EC;i++){const n=Array(g.length+1).fill(0);g.forEach((c,j)=>{n[j]^=c;n[j+1]^=mul(c,E[i])});g=n}
 const rs=a=>{const r=a.concat(Array(EC).fill(0));for(let i=0;i<a.length;i++){const f=r[i];if(f)for(let j=1;j<g.length;j++)r[i+j]^=mul(g[j],f)}return r.slice(a.length)};
 const blk=[];let o=0;for(let i=0;i<B1+B2;i++){const n=i<B1?D1:D1+1,dd=cw.slice(o,o+n);o+=n;blk.push([dd,rs(dd)])}
 const out=[];for(let i=0;i<D1+1;i++)blk.forEach(b=>{if(i<b[0].length)out.push(b[0][i])});for(let i=0;i<EC;i++)blk.forEach(b=>out.push(b[1][i]));
 const bo=[];out.forEach(b=>{for(let i=7;i>=0;i--)bo.push((b>>i)&1)});
 const N=21+4*v,M=Array.from({length:N},()=>Array(N).fill(0)),F=Array.from({length:N},()=>Array(N).fill(0)),st=(r,c,x)=>{if(r>=0&&c>=0&&r<N&&c<N){M[r][c]=+x;F[r][c]=1}};
 [[0,0],[0,N-7],[N-7,0]].forEach(([r,c])=>{for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++)st(r+i,c+j,i>=0&&i<=6&&j>=0&&j<=6&&(i%6==0||j%6==0||(i>=2&&i<=4&&j>=2&&j<=4)))});
 for(let i=8;i<N-8;i++){st(6,i,i%2==0);st(i,6,i%2==0)}
 const AP=[[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]][v],la=AP[AP.length-1];
 AP.forEach(r=>AP.forEach(c=>{if((r==6&&c==6)||(r==6&&c==la)||(r==la&&c==6))return;for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)st(r+i,c+j,Math.max(Math.abs(i),Math.abs(j))!=1)}));
 for(let i=0;i<9;i++){st(8,i,0);st(i,8,0)}for(let i=0;i<8;i++){st(8,N-1-i,0);st(N-1-i,8,0)}st(N-8,8,1);
 if(v>=6){let d2=(v+1)<<12;for(let i=17;i>=12;i--)if((d2>>i)&1)d2^=7973<<(i-12);const inf=((v+1)<<12)|d2;for(let i=0;i<18;i++){const a=Math.floor(i/3),b=i%3+N-11,x=(inf>>i)&1;st(a,b,x);st(b,a,x)}}
 let k=0,up=1;for(let c=N-1;c>0;c-=2){if(c==6)c--;for(let t=0;t<N;t++){const r=up?N-1-t:t;for(let j=0;j<2;j++){const cc=c-j;if(!F[r][cc]){M[r][cc]=k<bo.length?bo[k]:0;k++}}}up=!up}
 const MF=[(r,c)=>(r+c)%2==0,r=>r%2==0,(r,c)=>c%3==0,(r,c)=>(r+c)%3==0,(r,c)=>(((r/2)|0)+((c/3)|0))%2==0,(r,c)=>(r*c)%2+(r*c)%3==0,(r,c)=>((r*c)%2+(r*c)%3)%2==0,(r,c)=>((r+c)%2+(r*c)%3)%2==0];
 let best=null,bp=1e9;for(let m=0;m<8;m++){const Q=M.map((row,r)=>row.map((x,c)=>F[r][c]?x:x^+MF[m](r,c)));
  let f=m<<10;for(let i=14;i>=10;i--)if((f>>i)&1)f^=1335<<(i-10);f=((m<<10)|f)^21522;
  for(let i=0;i<15;i++){const x=(f>>i)&1;Q[i<6?i:i<8?i+1:N-15+i][8]=x;if(i<8)Q[8][N-i-1]=x;else Q[8][i<9?7:14-i]=x}
  let p=0;for(let a=0;a<2;a++)for(let i=0;i<N;i++){let run=1;for(let j=1;j<N;j++){const x=a?Q[j][i]:Q[i][j],y=a?Q[j-1][i]:Q[i][j-1];if(x==y){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}}
  if(p<bp){bp=p;best=Q}}return best}
function qSvg(M){const n=M.length;let p='';M.forEach((r,y)=>r.forEach((v,x)=>{if(v)p+=`M${x+4} ${y+4}h1v1h-1z`}));return`<svg viewBox="0 0 ${n+8} ${n+8}" width="100%" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`}
function qr(a){const c=S.cfg;if(!c.bin||!c.acc)return'<p class="mu">Chưa khai tài khoản ngân hàng trong Cài đặt.</p>';let m;try{m=qrM(vqr(c,a))}catch(e){return'<p class="mu">Không tạo được mã QR — kiểm tra mã ngân hàng và số tài khoản.</p>'}
 return`<div style="max-width:260px;margin:8px auto">${qSvg(m)}</div><p style="text-align:center">${c.bank?'<b>'+esc(c.bank)+'</b><br>':''}STK <b>${esc(c.acc)}</b>${c.holder?' · '+esc(c.holder):''}<br>Số tiền <b>${fmt(a)}đ</b></p>`}
/* ---- hàng hoá: thêm / sửa / xoá ---- */
function rProd(){const k=norm($('#pq').value),ps=S.products.filter(p=>!k||norm(p.n+' '+p.g).includes(k)).sort((a,b)=>(a.g||'').localeCompare(b.g||'','vi')||a.n.localeCompare(b.n,'vi'));
 $('#plist').innerHTML=ps.length?ps.map(p=>`<div class="li"><span><b>${esc(p.n)}</b>${p.f?' ★':''}${p.so?' · <span style="color:var(--rd)">hết</span>':''}<br><span class="mu">${esc(p.g||'—')} · ${fmt(price(p))}đ${p.u?' / '+esc(p.u):''}</span></span><button class="ghost" onclick="editP('${p.id}')">Sửa</button></div>`).join(''):'<p class="mu">Chưa có hàng hoá. Bấm "+ Thêm" hoặc nhập file ở Cài đặt.</p>'}
$('#pq').oninput=rProd;$('#padd').onclick=()=>editP();
function editP(id){const p=S.products.find(x=>x.id===id)||{n:'',g:G,u:'',p:'',sp:'',cost:'',so:0,f:0};
 modal(`<h3>${id?'Sửa':'Thêm'} hàng hoá</h3><label>Tên *<input id="e_n" value="${esc(p.n)}"></label><label>Nhóm<input id="e_g" list="gl" value="${esc(p.g)}"><datalist id="gl">${[...new Set(S.products.map(x=>x.g).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join('')}</datalist></label><div class="g2"><label>Đơn vị<input id="e_u" value="${esc(p.u)}"></label><label>Giá bán *<input id="e_p" inputmode="decimal" value="${p.p}"></label><label>Giá khuyến mãi<input id="e_sp" inputmode="decimal" value="${p.sp||''}"></label><label>Giá vốn<input id="e_c" inputmode="decimal" value="${p.cost||''}"></label></div>
 <div class="row"><label>% lãi<input id="e_m" inputmode="decimal"></label><button class="ghost" style="margin-top:20px" id="e_calc">Tính giá bán</button></div><p class="mu" style="font-size:12px">Giá bán = giá vốn × (1 + % lãi), làm tròn theo bước trong Cài đặt.</p>
 <label><input type="checkbox" id="e_so" style="width:auto" ${p.so?'checked':''}> Hết hàng</label><label><input type="checkbox" id="e_f" style="width:auto" ${p.f?'checked':''}> Yêu thích (hiện lên đầu)</label>
 <div class="row">${id?'<button class="dng" id="e_del">Xoá</button>':''}<button class="ghost" onclick="closeM()">Hủy</button><button class="pri" id="e_ok">Lưu</button></div>`);
 $('#e_calc').onclick=()=>{const c=num($('#e_c').value),m=num($('#e_m').value);if(c>=0&&m>=0)$('#e_p').value=roundTo(c*(1+m/100));else toast('Nhập giá vốn và % lãi')};
 $('#e_ok').onclick=()=>{const n=$('#e_n').value.trim(),pr=num($('#e_p').value);if(!n||!(pr>=0)){toast('Cần tên và giá bán hợp lệ');return}
  const o=id?p:{id:uid()};Object.assign(o,{n,g:$('#e_g').value.trim(),u:$('#e_u').value.trim(),p:pr,sp:num($('#e_sp').value)||0,cost:num($('#e_c').value)||0,so:$('#e_so').checked?1:0,f:$('#e_f').checked?1:0});if(!id)S.products.push(o);save();closeM();rProd();toast('Đã lưu')};
 if(id)$('#e_del').onclick=()=>{if(confirm('Xoá "'+p.n+'"? Đơn cũ vẫn giữ nguyên.')){S.products=S.products.filter(x=>x.id!==id);delete cart[id];save();closeM();rProd()}}}
/* ---- đơn hàng & báo cáo ---- */
const RG=[['today','Hôm nay'],['7','7 ngày'],['30','30 ngày'],['all','Tất cả']];
function rRep(){$('#rg').innerHTML=RG.map(([k,l])=>`<button class="${k===R?'on':''}" data-r="${k}">${l}</button>`).join('');
 const n=R==='all'?0:R==='today'?1:+R,t0=new Date();t0.setHours(0,0,0,0);const from=n?t0.getTime()-(n-1)*864e5:0;

const PH=['Nhóm','Tên sản phẩm','Đơn vị','Giá','Giá KM','Giá vốn','Hết hàng (x = hết)','Yêu thích (x = có)'];
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([type==='text/csv'?'\uFEFF'+txt:txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function csv(rows){return rows.map(r=>r.map(v=>{let s=String(v??'');if(typeof v!=='number'&&/^[=+\-@\t\r]/.test(s))s="'"+s;return/[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\r\n')}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const h=t.split('\n')[0],sep=h.includes('\t')?'\t':((h.match(/;/g)||[]).length>(h.match(/,/g)||[]).length?';':','),rows=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===sep){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}
 r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}
function pick(acc,cb){const i=document.createElement('input');i.type='file';i.accept=acc;i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>20e6){toast('File quá lớn (tối đa 20 MB)');return}const r=new FileReader();r.onload=()=>cb(String(r.result));r.readAsText(f,'utf-8')};i.click()}

function impCSV(t){const rows=parseCSV(t);if(rows.length<2){toast('File không có dữ liệu');return}const H=rows[0].map(norm);
 const ix=(...k)=>H.findIndex(h=>k.some(x=>h===x||h.startsWith(x+' ')||h.startsWith(x+'(')));const c={g:ix('nhom','tab'),n:ix('ten san pham','ten hang','ten'),u:ix('don vi'),p:H.indexOf('gia'),sp:ix('gia km','gia khuyen mai'),cost:ix('gia von'),so:ix('het hang'),f:ix('yeu thich')};
 if(c.n<0||c.p<0){toast('Thiếu cột "Tên sản phẩm" hoặc "Giá"');return}
 const flag=v=>/^(x|1|co|true)$/.test(norm(v)),ok=[],err=[];
 rows.slice(1).forEach((r,i)=>{const g=k=>c[k]>=0?String(r[c[k]]??'').trim():'',n=g('n'),p=num(g('p'));if(!n){err.push('Dòng '+(i+2)+': thiếu tên');return}if(!(p>=0)){err.push('Dòng '+(i+2)+': giá không hợp lệ');return}
  ok.push({g:g('g'),n:n.slice(0,120),u:g('u').slice(0,20),p,sp:num(g('sp'))||0,cost:num(g('cost'))||0,so:flag(g('so'))?1:0,f:flag(g('f'))?1:0})});
 if(!ok.length){toast('Không có dòng hợp lệ. '+(err[0]||''));return}
 choose(`${ok.length} dòng hợp lệ, ${err.length} dòng lỗi${err.length?'<br><span class="mu">'+err.slice(0,5).map(esc).join('<br>')+(err.length>5?'<br>…':'')+'</span>':''}`,
  ()=>ok.forEach(o=>{const e=S.products.find(p=>key(p)===key(o));e?Object.assign(e,o):S.products.push(Object.assign({id:uid()},o))}),
  ()=>{S.products=ok.map(o=>Object.assign({id:uid()},o));cart={}})}

   if(c.bin&&c.acc){const k=QM?Math.max(3,Math.floor(220/(QM.length+8))):0,s=QM?(QM.length+8)*k:0;if(!dry&&QM){const x0=(W-s)/2;x.fillStyle='#000';QM.forEach((r,j)=>r.forEach((v,i)=>{if(v)x.fillRect(x0+(i+4)*k,y+10+(j+4)*k,k,k)}))}y+=10+s;
    if(c.bank)CT(c.bank,14,'600','#333',22);CT('STK '+c.acc,15,'700',null,c.bank?20:22);if(c.holder)CT(c.holder,13,'400','#555',18);if(!QM)CT('(Không tạo được mã QR — kiểm tra mã ngân hàng và số tài khoản)',12,'400','#999',16)}else CT('Chưa khai tài khoản ngân hàng trong Cài đặt',13,'400','#999',22)}
