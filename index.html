<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Công cụ bán hàng</title>
<style>
:root{--c:#2f6f4e;--bg:#f4f6f4;--ink:#1d2420;--mu:#68736c;--ln:#dce2de;--w:#fff;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141916;--ink:#e8ede9;--mu:#98a39c;--ln:#2b332e;--w:#1e2521}}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input,select{background:var(--w);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
header{background:var(--c);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-shrink:0}
#brand{font-weight:700;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab{padding:6px 10px;border-radius:8px;color:#fff;opacity:.8}.tab.on{background:rgba(255,255,255,.22);opacity:1}
main{flex:1;min-height:0;position:relative}.v{display:none;height:100%;overflow:auto;padding:12px}.v.on{display:block}
#v-sell.on{display:grid;grid-template-columns:1fr 340px;gap:12px;overflow:hidden;padding:0}
@media(max-width:760px){#v-sell.on{grid-template-columns:1fr;grid-template-rows:1fr minmax(0,46%)}}
.pane{display:flex;flex-direction:column;min-height:0;padding:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;flex-shrink:0}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--w);white-space:nowrap}.chip.on{background:var(--c);color:#fff;border-color:var(--c)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;overflow:auto;align-content:start;flex:1}
.it{background:var(--w);border:1px solid var(--ln);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
.it span{color:var(--mu);font-size:13px}.it.so{opacity:.5}.it i{position:absolute;top:6px;right:8px;font-size:11px;color:var(--rd);font-style:normal}
.cartp{background:var(--w);border-left:1px solid var(--ln)}
#cart{flex:1;overflow:auto}.ln{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.q{display:flex;align-items:center;gap:4px}.q button{width:28px;height:28px;border:1px solid var(--ln);border-radius:6px}.q input{width:58px;text-align:center;padding:4px}
.mu{color:var(--mu)}.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:8px 0}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.pri,.ghost,.dng{padding:10px 14px;border-radius:10px;border:1px solid var(--c)}.pri{background:var(--c);color:#fff}.dng{color:var(--rd);border-color:var(--rd)}
.card{background:var(--w);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin-bottom:8px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mu)}label input,label select{color:var(--ink);margin-top:3px}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);align-items:center}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.st div{background:var(--bg);border-radius:10px;padding:8px}.st b{display:block;font-size:17px}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}.bars div{flex:1;background:var(--c);border-radius:3px 3px 0 0;min-height:2px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px;border:1px solid var(--ln);border-radius:8px}.seg .on{background:var(--c);color:#fff}
#mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}#mo[hidden]{display:none}
#md{background:var(--w);border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
#md h3{margin-bottom:10px}#md label{margin-bottom:8px}#md img{width:100%;max-width:260px;display:block;margin:8px auto}
#snk{position:fixed;left:12px;right:12px;bottom:12px;background:#222;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:8}#snk[hidden]{display:none}
#snk span{margin-right:auto}#snk button{color:#9fe3b9}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:99px;z-index:10;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}
#rc{display:none}
@media print{body>*:not(#rc){display:none!important}#rc{display:block;width:58mm;font:12px/1.35 monospace;color:#000;background:#fff}#rc h2{font-size:15px;text-align:center}#rc td{padding:1px 0;vertical-align:top}#rc .r{text-align:right}}
</style>
</head>
<body>
<header><span id="brand">Bán hàng</span>
<button class="tab on" data-v="sell">Bán hàng</button><button class="tab" data-v="prod">Hàng hoá</button><button class="tab" data-v="rep">Đơn hàng</button><button class="tab" data-v="set">Cài đặt</button></header>
<main>
<section class="v on" id="v-sell">
 <div class="pane"><input id="q" placeholder="Tìm hàng…" type="search"><div class="chips" id="chips"></div><div id="grid"></div></div>
 <div class="pane cartp"><div id="cart"></div>
  <label>Giảm giá (đ)<input id="disc" inputmode="decimal"></label>
  <div class="tot"><span>Tổng</span><span id="tt">0đ</span></div>
  <div class="row"><button class="pri" id="quick">💵 Thu đủ</button><button class="ghost" id="pay">Thanh toán…</button></div></div>
</section>
<section class="v" id="v-prod"><div class="row" style="margin:0 0 10px"><input id="pq" type="search" placeholder="Tìm hàng hoá…"><button class="pri" style="flex:none" id="padd">+ Thêm</button></div><div class="card" id="plist"></div></section>
<section class="v" id="v-rep"><div class="card"><div class="seg" id="rg"></div></div><div class="card"><div class="st" id="stats"></div><div class="bars" id="bars" style="margin-top:12px"></div></div><div class="card"><h3>Bán chạy</h3><div id="top"></div></div><div class="card"><h3>Đơn hàng</h3><div id="olist"></div></div></section>
<section class="v" id="v-set"><div class="card" id="cfgc"></div><div class="card" id="datac"></div></section>
</main>
<div id="snk" hidden></div><div id="mo" hidden><div id="md"></div></div><div id="toast"></div><div id="rc"></div>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n||0).toLocaleString('vi-VN');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim();
const num=v=>{let s=String(v??'').replace(/[^\d.,-]/g,'');if(!s)return NaN;if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else if(/^-?\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');return parseFloat(s)};
const dk=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const tm=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())};
const DEF=()=>({cfg:{name:'',phone:'',addr:'',foot:'',pre:'',color:'#2f6f4e',bin:'',acc:'',holder:'',round:1000},products:[],orders:[],counter:0,lastBackup:0});
let S=DEF(),DBH=null,cart={},G='',Q='',R='today',last=null,hs;
/* ---- lưu trữ: IndexedDB, toàn bộ dữ liệu nằm trên máy ---- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('ban-hang-local',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function load(){try{DBH=await idb();const v=await new Promise(r=>{const q=DBH.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v)S=Object.assign(DEF(),v,{cfg:Object.assign(DEF().cfg,v.cfg)})}catch(e){DBH=null;toast('Trình duyệt không cho lưu dữ liệu — hãy xuất file sao lưu thường xuyên')}}
function save(){if(DBH)try{DBH.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'s')}catch(e){toast('Không lưu được dữ liệu')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(hs);hs=setTimeout(()=>t.classList.remove('on'),2200)}
function modal(h){$('#md').innerHTML=h;$('#mo').hidden=false}function closeM(){$('#mo').hidden=true}
$('#mo').onclick=e=>{if(e.target.id==='mo')closeM()};
const price=p=>p.sp>0&&p.sp<p.p?p.sp:p.p;
const roundTo=v=>{const s=S.cfg.round>0?S.cfg.round:1;return Math.round(v/s)*s};
function applyCfg(){document.documentElement.style.setProperty('--c',S.cfg.color||'#2f6f4e');$('#brand').textContent=S.cfg.name||'Bán hàng';document.title=S.cfg.name||'Công cụ bán hàng'}
function go(v){$$('.v').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));$$('.tab').forEach(e=>e.classList.toggle('on',e.dataset.v===v));({sell:rSell,prod:rProd,rep:rRep,set:rSet})[v]()}
$$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));
/* ---- bán hàng ---- */
function rSell(){const gs=[...new Set(S.products.map(p=>p.g||''))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'vi'));if(G&&!gs.includes(G))G='';
 $('#chips').innerHTML=['',...gs].map(g=>`<button class="chip${g===G?' on':''}" data-g="${esc(g)}">${g?esc(g):'Tất cả'}</button>`).join('');
 const k=norm(Q),ps=S.products.filter(p=>(!G||p.g===G)&&(!k||norm(p.n).includes(k))).sort((a,b)=>(b.f?1:0)-(a.f?1:0)||a.n.localeCompare(b.n,'vi'));
 $('#grid').innerHTML=ps.length?ps.map(p=>`<button class="it${p.so?' so':''}" data-id="${p.id}"><b>${esc(p.n)}</b><span>${fmt(price(p))}đ${p.u?' / '+esc(p.u):''}</span>${p.so?'<i>Hết</i>':''}</button>`).join(''):`<p class="mu">${S.products.length?'Không có hàng phù hợp.':'Chưa có hàng hoá. Vào Hàng hoá để thêm, hoặc Cài đặt → Nhập file.'}</p>`;rCart()}
function tot(){let sub=0;const L=Object.keys(cart).map(id=>{const p=S.products.find(x=>x.id===id);if(!p){delete cart[id];return null}const a=Math.round(cart[id]*price(p));sub+=a;return{p,q:cart[id],a}}).filter(Boolean);const d=Math.min(Math.max(num($('#disc').value)||0,0),sub);return{L,sub,d,t:sub-d}}
function rCart(){const T=tot();$('#cart').innerHTML=T.L.length?T.L.map(l=>`<div class="ln"><b>${esc(l.p.n)}</b><b>${fmt(l.a)}đ</b><span class="mu">${fmt(price(l.p))}đ${l.p.u?' / '+esc(l.p.u):''}</span><div class="q" data-id="${l.p.id}"><button data-a="-">−</button><input value="${l.q}" inputmode="decimal"><button data-a="+">+</button><button data-a="x">✕</button></div></div>`).join(''):'<p class="mu">Giỏ trống — chạm vào hàng để thêm.</p>';$('#tt').textContent=fmt(T.t)+'đ'}
$('#q').oninput=e=>{Q=e.target.value;rSell()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){G=b.dataset.g;rSell()}};
$('#grid').onclick=e=>{const b=e.target.closest('.it');if(!b)return;const p=S.products.find(x=>x.id===b.dataset.id);if(p.so){toast('Mặt hàng đang hết');return}cart[p.id]=(cart[p.id]||0)+1;rCart()};
$('#cart').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.parentNode.dataset.id,a=b.dataset.a;if(a==='x')delete cart[id];else{cart[id]=Math.round((cart[id]+(a==='+'?1:-1))*1000)/1000;if(cart[id]<=0)delete cart[id]}rCart()};
$('#cart').onchange=e=>{if(e.target.tagName!=='INPUT')return;const id=e.target.parentNode.dataset.id,v=num(e.target.value);if(v>0)cart[id]=v;else delete cart[id];rCart()};
$('#disc').oninput=rCart;
function done(method,cash){const T=tot();if(!T.L.length)return;S.counter++;const o={id:uid(),no:(S.cfg.pre||'')+String(S.counter).padStart(5,'0'),ts:Date.now(),items:T.L.map(l=>({i:l.p.id,n:l.p.n,u:l.p.u||'',q:l.q,p:price(l.p)})),sub:T.sub,disc:T.d,amt:T.t,method,cash:method==='cash'?cash:0,change:method==='cash'&&cash>T.t?cash-T.t:0,void:false};
 S.orders.push(o);save();cart={};$('#disc').value='';last=o;rSell();snack(o)}
function snack(o){const s=$('#snk');s.hidden=false;s.innerHTML=`<span>✓ ${esc(o.no)} · ${fmt(o.amt)}đ</span><button onclick="printO('${o.id}')">In</button><button onclick="undo()">Hoàn tác</button>`;clearTimeout(snack.t);snack.t=setTimeout(()=>s.hidden=true,6000)}
function undo(){$('#snk').hidden=true;const o=last;if(!o||o.void)return;o.void=true;save();o.items.forEach(i=>{if(S.products.some(p=>p.id===i.i))cart[i.i]=(cart[i.i]||0)+i.q});rSell();toast('Đã hoàn tác '+o.no)}
$('#quick').onclick=()=>{const T=tot();if(T.L.length)done('cash',T.t)};
$('#pay').onclick=()=>{const T=tot();if(!T.L.length)return;let m='cash';
 modal(`<h3>Thanh toán ${fmt(T.t)}đ</h3><div class="seg"><button id="m1" class="on">Tiền mặt</button><button id="m2">Chuyển khoản</button></div><div id="pc" style="margin-top:10px"><label>Khách đưa (đ)<input id="cg" inputmode="decimal"></label><p>Tiền thối: <b id="ch">0đ</b></p></div><div id="pqr" hidden>${qr(T.t)}</div><div class="row"><button class="ghost" onclick="closeM()">Hủy</button><button class="pri" id="ok">Xác nhận</button></div>`);
 $('#m1').onclick=$('#m2').onclick=e=>{m=e.target.id==='m1'?'cash':'qr';$('#m1').classList.toggle('on',m==='cash');$('#m2').classList.toggle('on',m==='qr');$('#pc').hidden=m!=='cash';$('#pqr').hidden=m!=='qr'};
 $('#cg').oninput=e=>{$('#ch').textContent=fmt(Math.max(0,(num(e.target.value)||0)-T.t))+'đ'};
 $('#ok').onclick=()=>{const c=num($('#cg').value)||0;if(m==='cash'&&c>0&&c<T.t){toast('Khách đưa chưa đủ');return}closeM();done(m,m==='cash'?(c||T.t):0)}};
function qr(a){const c=S.cfg;if(!c.bin||!c.acc)return'<p class="mu">Chưa khai tài khoản ngân hàng trong Cài đặt.</p>';
 return`<img alt="Mã QR" src="https://img.vietqr.io/image/${encodeURIComponent(c.bin)}-${encodeURIComponent(c.acc)}-compact.png?amount=${Math.round(a)}&accountName=${encodeURIComponent(c.holder)}"><p style="text-align:center">STK <b>${esc(c.acc)}</b> · ${esc(c.holder)}<br>Số tiền <b>${fmt(a)}đ</b></p>`}
function printO(id){const o=S.orders.find(x=>x.id===id);if(!o)return;const c=S.cfg;
 $('#rc').innerHTML=`<h2>${esc(c.name)}</h2><p style="text-align:center">${esc(c.addr)}${c.phone?'<br>ĐT: '+esc(c.phone):''}</p><p>Phiếu ${esc(o.no)} · ${tm(o.ts)}${o.void?' · ĐÃ HUỶ':''}</p><hr><table width="100%">${o.items.map(i=>`<tr><td colspan="2">${esc(i.n)}</td></tr><tr><td>${i.q} x ${fmt(i.p)}${i.u?' /'+esc(i.u):''}</td><td class="r">${fmt(i.q*i.p)}</td></tr>`).join('')}</table><hr><table width="100%"><tr><td>Tạm tính</td><td class="r">${fmt(o.sub)}</td></tr>${o.disc?`<tr><td>Giảm giá</td><td class="r">-${fmt(o.disc)}</td></tr>`:''}<tr><td><b>TỔNG</b></td><td class="r"><b>${fmt(o.amt)}</b></td></tr>${o.method==='cash'&&o.cash?`<tr><td>Khách đưa</td><td class="r">${fmt(o.cash)}</td></tr><tr><td>Thối</td><td class="r">${fmt(o.change)}</td></tr>`:''}<tr><td>Hình thức</td><td class="r">${o.method==='qr'?'Chuyển khoản':'Tiền mặt'}</td></tr></table><p style="text-align:center">${esc(c.foot)}</p>`;window.print()}
/* ---- hàng hoá: thêm / sửa / xoá ---- */
function rProd(){const k=norm($('#pq').value),ps=S.products.filter(p=>!k||norm(p.n+' '+p.g).includes(k)).sort((a,b)=>(a.g||'').localeCompare(b.g||'','vi')||a.n.localeCompare(b.n,'vi'));
 $('#plist').innerHTML=ps.length?ps.map(p=>`<div class="li"><span><b>${esc(p.n)}</b>${p.f?' ★':''}${p.so?' · <span style="color:var(--rd)">hết</span>':''}<br><span class="mu">${esc(p.g||'—')} · ${fmt(price(p))}đ${p.u?' / '+esc(p.u):''}</span></span><button class="ghost" onclick="editP('${p.id}')">Sửa</button></div>`).join(''):'<p class="mu">Chưa có hàng hoá. Bấm "+ Thêm" hoặc nhập file ở Cài đặt.</p>'}
$('#pq').oninput=rProd;$('#padd').onclick=()=>editP();
function editP(id){const p=S.products.find(x=>x.id===id)||{n:'',g:G,u:'',p:'',sp:'',cost:'',so:0,f:0};
 modal(`<h3>${id?'Sửa':'Thêm'} hàng hoá</h3><label>Tên *<input id="e_n" value="${esc(p.n)}"></label><label>Nhóm<input id="e_g" list="gl" value="${esc(p.g)}"><datalist id="gl">${[...new Set(S.products.map(x=>x.g).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join('')}</datalist></label><div class="g2"><label>Đơn vị<input id="e_u" value="${esc(p.u)}"></label><label>Giá bán *<input id="e_p" inputmode="decimal" value="${p.p}"></label><label>Giá khuyến mãi<input id="e_sp" inputmode="decimal" value="${p.sp||''}"></label><label>Giá vốn<input id="e_c" inputmode="decimal" value="${p.cost||''}"></label></div>
 <div class="row"><label>% lãi<input id="e_m" inputmode="decimal"></label><button class="ghost" style="margin-top:20px" id="e_calc">Tính giá bán</button></div><p class="mu" style="font-size:12px">Giá bán = giá vốn × (1 + % lãi), làm tròn theo bước trong Cài đặt.</p>
 <label><input type="checkbox" id="e_so" style="width:auto" ${p.so?'checked':''}> Hết hàng</label><label><input type="checkbox" id="e_f" style="width:auto" ${p.f?'checked':''}> Yêu thích (hiện lên đầu)</label>
 <div class="row">${id?'<button class="dng" id="e_del">Xoá</button>':''}<button class="ghost" onclick="closeM()">Hủy</button><button class="pri" id="e_ok">Lưu</button></div>`);
 $('#e_calc').onclick=()=>{const c=num($('#e_c').value),m=num($('#e_m').value);if(c>=0&&m>=0)$('#e_p').value=roundTo(c*(1+m/100));else toast('Nhập giá vốn và % lãi')};
 $('#e_ok').onclick=()=>{const n=$('#e_n').value.trim(),pr=num($('#e_p').value);if(!n||!(pr>=0)){toast('Cần tên và giá bán hợp lệ');return}
  const o=id?p:{id:uid()};Object.assign(o,{n,g:$('#e_g').value.trim(),u:$('#e_u').value.trim(),p:pr,sp:num($('#e_sp').value)||0,cost:num($('#e_c').value)||0,so:$('#e_so').checked?1:0,f:$('#e_f').checked?1:0});if(!id)S.products.push(o);save();closeM();rProd();toast('Đã lưu')};
 if(id)$('#e_del').onclick=()=>{if(confirm('Xoá "'+p.n+'"? Đơn cũ vẫn giữ nguyên.')){S.products=S.products.filter(x=>x.id!==id);delete cart[id];save();closeM();rProd()}}}
/* ---- đơn hàng & báo cáo ---- */
const RG={today:'Hôm nay','7':'7 ngày','30':'30 ngày',all:'Tất cả'};
function rRep(){$('#rg').innerHTML=Object.keys(RG).map(k=>`<button class="${k===R?'on':''}" data-r="${k}">${RG[k]}</button>`).join('');
 const n=R==='all'?0:R==='today'?1:+R,t0=new Date();t0.setHours(0,0,0,0);const from=n?t0.getTime()-(n-1)*864e5:0;
 const os=S.orders.filter(o=>o.ts>=from).sort((a,b)=>b.ts-a.ts),lv=os.filter(o=>!o.void),sum=a=>a.reduce((s,o)=>s+o.amt,0),cash=lv.filter(o=>o.method==='cash'),qrs=lv.filter(o=>o.method==='qr');
 $('#stats').innerHTML=`<div>Doanh thu<b>${fmt(sum(lv))}đ</b></div><div>Số đơn<b>${lv.length}</b></div><div>Tiền mặt<b>${fmt(sum(cash))}đ</b></div><div>Chuyển khoản<b>${fmt(sum(qrs))}đ</b></div>`;
 const days=n===1?0:Math.min(n||14,31),ds=[];for(let i=days-1;i>=0;i--)ds.push(dk(t0.getTime()-i*864e5));
 const by={};lv.forEach(o=>by[dk(o.ts)]=(by[dk(o.ts)]||0)+o.amt);const mx=Math.max(1,...ds.map(d=>by[d]||0));
 $('#bars').innerHTML=days>1?ds.map(d=>`<div title="${d}: ${fmt(by[d]||0)}đ" style="height:${(by[d]||0)/mx*100}%"></div>`).join(''):'';
 const tp={};lv.forEach(o=>o.items.forEach(i=>{const x=tp[i.n]=tp[i.n]||{q:0,a:0};x.q+=i.q;x.a+=i.q*i.p}));
 $('#top').innerHTML=Object.entries(tp).sort((a,b)=>b[1].a-a[1].a).slice(0,5).map(([k,v])=>`<div class="li"><span>${esc(k)}</span><span>${Math.round(v.q*100)/100} · ${fmt(v.a)}đ</span></div>`).join('')||'<p class="mu">Chưa có dữ liệu.</p>';
 $('#olist').innerHTML=os.slice(0,100).map(o=>`<div class="li" onclick="viewO('${o.id}')" style="cursor:pointer;${o.void?'opacity:.5;text-decoration:line-through':''}"><span><b>${esc(o.no)}</b> <span class="mu">${tm(o.ts)} · ${o.method==='qr'?'CK':'TM'}</span></span><b>${fmt(o.amt)}đ</b></div>`).join('')||'<p class="mu">Chưa có đơn.</p>'}
$('#rg').onclick=e=>{const b=e.target.closest('[data-r]');if(b){R=b.dataset.r;rRep()}};
function viewO(id){const o=S.orders.find(x=>x.id===id);modal(`<h3>${esc(o.no)} · ${tm(o.ts)}${o.void?' (đã huỷ)':''}</h3>${o.items.map(i=>`<div class="li"><span>${esc(i.n)}<br><span class="mu">${i.q} × ${fmt(i.p)}đ</span></span><b>${fmt(i.q*i.p)}đ</b></div>`).join('')}<div class="tot"><span>Tổng</span><span>${fmt(o.amt)}đ</span></div><div class="row"><button class="ghost" onclick="closeM()">Đóng</button><button class="ghost" onclick="closeM();printO('${o.id}')">In</button><button class="dng" onclick="voidO('${o.id}')">${o.void?'Khôi phục':'Huỷ đơn'}</button></div>`)}
function voidO(id){const o=S.orders.find(x=>x.id===id);o.void=!o.void;save();closeM();rRep()}
/* ---- cài đặt ---- */
const FLD=[['name','Tên cửa hàng'],['phone','Số điện thoại'],['addr','Địa chỉ'],['foot','Lời cảm ơn cuối phiếu'],['pre','Tiền tố số phiếu (tuỳ chọn)'],['color','Màu chủ đạo','color'],['bin','Mã ngân hàng VietQR (BIN)'],['acc','Số tài khoản'],['holder','Tên chủ tài khoản'],['round','Bước làm tròn giá (đ)']];
function rSet(){$('#cfgc').innerHTML=`<h3>Thông tin cửa hàng</h3>${S.cfg.name?'':'<p class="mu" style="margin-bottom:8px">Điền tên cửa hàng rồi bấm Lưu để bắt đầu. Mọi thông tin chỉ lưu trên máy này.</p>'}<div class="g2">${FLD.map(([k,l,t])=>`<label>${l}<input id="s_${k}" type="${t||'text'}" value="${esc(S.cfg[k])}"></label>`).join('')}</div><div class="row"><button class="pri" id="s_ok">Lưu</button></div>`;
 $('#s_ok').onclick=()=>{FLD.forEach(([k])=>{let v=$('#s_'+k).value.trim();if(k==='round')v=num(v)>0?num(v):1;S.cfg[k]=v});save();applyCfg();toast('Đã lưu cài đặt')};
 const lb=S.lastBackup?new Date(S.lastBackup).toLocaleString('vi-VN'):'chưa từng';
 $('#datac').innerHTML=`<h3>Dữ liệu (${S.products.length} hàng · ${S.orders.length} đơn)</h3><p class="mu" style="margin-bottom:8px">Dữ liệu nằm trong trình duyệt của máy này. Sao lưu gần nhất: ${lb}.</p><div class="g2"><button class="pri" id="x1">⬇ Sao lưu đầy đủ (JSON)</button><button class="ghost" id="i1">⬆ Khôi phục từ JSON</button><button class="ghost" id="x2">⬇ Xuất hàng hoá (CSV)</button><button class="ghost" id="i2">⬆ Nhập hàng hoá (CSV)</button><button class="ghost" id="x3">⬇ Xuất đơn hàng (CSV)</button><button class="ghost" id="x4">⬇ Tải file CSV mẫu</button></div><div class="row"><button class="dng" id="wipe">Xoá toàn bộ dữ liệu</button></div>`;
 $('#x1').onclick=()=>{S.lastBackup=Date.now();save();dl('sao-luu-'+dk(Date.now())+'.json',JSON.stringify({app:'ban-hang-local',v:1,S},null,1),'application/json');rSet()};
 $('#i1').onclick=()=>pick('.json',impJSON);$('#i2').onclick=()=>pick('.csv,.tsv,.txt',impCSV);
 $('#x2').onclick=()=>dl('hang-hoa.csv',csv([PH,...S.products.map(p=>[p.g,p.n,p.u,p.p,p.sp||'',p.cost||'',p.so?'x':'',p.f?'x':''])]),'text/csv');
 $('#x3').onclick=()=>dl('don-hang.csv',csv([['Số phiếu','Ngày','Giờ','Tên hàng','Đơn vị','SL','Đơn giá','Thành tiền','Thanh toán','Trạng thái'],...S.orders.flatMap(o=>o.items.map(i=>[o.no,dk(o.ts),tm(o.ts).slice(6),i.n,i.u,i.q,i.p,Math.round(i.q*i.p),o.method==='qr'?'Chuyển khoản':'Tiền mặt',o.void?'Đã huỷ':'Hoàn tất']))]),'text/csv');
 $('#x4').onclick=()=>dl('mau-hang-hoa.csv',csv([PH]),'text/csv');
 $('#wipe').onclick=()=>{if(confirm('Xoá TOÀN BỘ dữ liệu trên máy này? Hãy sao lưu trước.')&&confirm('Chắc chắn xoá?')){S=DEF();cart={};save();applyCfg();go('set')}}}
/* ---- nhập / xuất ---- */
const PH=['Nhóm','Tên sản phẩm','Đơn vị','Giá','Giá KM','Giá vốn','Hết hàng (x = hết)','Yêu thích (x = có)'];
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([type==='text/csv'?'\uFEFF'+txt:txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function csv(rows){return rows.map(r=>r.map(v=>{let s=String(v??'');if(typeof v!=='number'&&/^[=+\-@\t\r]/.test(s))s="'"+s;return/[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\r\n')}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const h=t.split('\n')[0],sep=h.includes('\t')?'\t':((h.match(/;/g)||[]).length>(h.match(/,/g)||[]).length?';':','),rows=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===sep){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}
 r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}
function pick(acc,cb){const i=document.createElement('input');i.type='file';i.accept=acc;i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>20e6){toast('File quá lớn (tối đa 20 MB)');return}const r=new FileReader();r.onload=()=>cb(String(r.result));r.readAsText(f,'utf-8')};i.click()}
const key=p=>norm(p.g)+'|'+norm(p.n);
function choose(msg,onMerge,onReplace){modal(`<h3>Nhập dữ liệu</h3><p style="margin-bottom:10px">${msg}</p><div class="row"><button class="ghost" onclick="closeM()">Hủy</button><button class="ghost" id="c_m">Gộp</button><button class="dng" id="c_r">Thay thế</button></div><p class="mu" style="font-size:12px;margin-top:8px">Gộp: giữ dữ liệu hiện có, cập nhật hàng trùng tên + nhóm. Thay thế: xoá phần hiện có.</p>`);$('#c_m').onclick=()=>{closeM();onMerge();save();go('set');toast('Đã gộp')};$('#c_r').onclick=()=>{if(confirm('Thay thế dữ liệu hiện có?')){closeM();onReplace();save();go('set');toast('Đã thay thế')}}}
function impCSV(t){const rows=parseCSV(t);if(rows.length<2){toast('File không có dữ liệu');return}const H=rows[0].map(norm);
 const ix=(...k)=>H.findIndex(h=>k.some(x=>h===x||h.startsWith(x+' ')||h.startsWith(x+'(')));const c={g:ix('nhom','tab'),n:ix('ten san pham','ten hang','ten'),u:ix('don vi'),p:H.indexOf('gia'),sp:ix('gia km','gia khuyen mai'),cost:ix('gia von'),so:ix('het hang'),f:ix('yeu thich')};
 if(c.n<0||c.p<0){toast('Thiếu cột "Tên sản phẩm" hoặc "Giá"');return}
 const flag=v=>/^(x|1|co|true)$/.test(norm(v)),ok=[],err=[];
 rows.slice(1).forEach((r,i)=>{const g=k=>c[k]>=0?String(r[c[k]]??'').trim():'',n=g('n'),p=num(g('p'));if(!n){err.push('Dòng '+(i+2)+': thiếu tên');return}if(!(p>=0)){err.push('Dòng '+(i+2)+': giá không hợp lệ');return}
  ok.push({g:g('g'),n:n.slice(0,120),u:g('u').slice(0,20),p,sp:num(g('sp'))||0,cost:num(g('cost'))||0,so:flag(g('so'))?1:0,f:flag(g('f'))?1:0})});
 if(!ok.length){toast('Không có dòng hợp lệ. '+(err[0]||''));return}
 choose(`${ok.length} dòng hợp lệ, ${err.length} dòng lỗi${err.length?'<br><span class="mu">'+err.slice(0,5).map(esc).join('<br>')+(err.length>5?'<br>…':'')+'</span>':''}`,
  ()=>ok.forEach(o=>{const e=S.products.find(p=>key(p)===key(o));e?Object.assign(e,o):S.products.push(Object.assign({id:uid()},o))}),
  ()=>{S.products=ok.map(o=>Object.assign({id:uid()},o));cart={}})}
function impJSON(t){let d;try{d=JSON.parse(t)}catch(e){toast('File JSON không đọc được');return}
 if(!d||d.app!=='ban-hang-local'||!d.S||!Array.isArray(d.S.products)||!Array.isArray(d.S.orders)){toast('Không phải file sao lưu của công cụ này');return}
 const X=d.S;choose(`File có ${X.products.length} hàng hoá, ${X.orders.length} đơn.`,
  ()=>{X.products.forEach(o=>{const e=S.products.find(p=>key(p)===key(o));if(e)Object.assign(e,o,{id:e.id});else S.products.push(o)});const ids=new Set(S.orders.map(o=>o.id));X.orders.forEach(o=>{if(!ids.has(o.id))S.orders.push(o)});S.counter=Math.max(S.counter,X.counter||0);if(!S.cfg.name)S.cfg=Object.assign(DEF().cfg,X.cfg);applyCfg()},
  ()=>{S=Object.assign(DEF(),X,{cfg:Object.assign(DEF().cfg,X.cfg)});cart={};applyCfg()})}
(async()=>{await load();applyCfg();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if(S.orders.length&&Date.now()-(S.lastBackup||0)>7*864e5)toast('Đã hơn 7 ngày chưa sao lưu — vào Cài đặt để sao lưu');
 go(S.cfg.name?'sell':'set')})();
</script>
