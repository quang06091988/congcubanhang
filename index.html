<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0f9d76"><link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bán hàng"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website"><meta property="og:site_name" content="Công cụ bán hàng"><meta property="og:title" content="Công cụ bán hàng"><meta property="og:description" content="Bán hàng, in phiếu, báo cáo — dữ liệu nằm ngay trên máy bạn."><meta property="og:image" content="https://congcubanhang.vercel.app/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:locale" content="vi_VN">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Công cụ bán hàng"><meta name="twitter:image" content="https://congcubanhang.vercel.app/og.png">
<style>
:root{--c:#0f9d76;--a:#ffb020;--bg:#eaf2ef;--ink:#10201a;--mu:#5f7168;--ln:#d9e4df;--w:#fff;--rd:#d9382c;--sh:0 8px 28px rgba(10,60,45,.13);--g:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#1457c8));--fs:15px;--tap:40px;--btn:48px;--gw:150px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);background:var(--c)}
html[data-z="1"]{--fs:17px;--tap:46px;--btn:54px;--gw:165px}
html[data-z="2"]{--fs:19px;--tap:52px;--btn:60px;--gw:185px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1512;--ink:#e8f0ec;--mu:#93a69c;--ln:#25322b;--w:#17211c;--sh:0 8px 28px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:var(--fs)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template:"h h" auto "n m" minmax(0,1fr)/84px 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;position:relative;overflow:hidden;transition:transform .12s,box-shadow .2s,filter .2s}button:active{transform:scale(.95)}button:disabled{opacity:.5}
input,select{background:var(--w);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%;font-size:max(16px,1em);transition:border-color .2s,box-shadow .2s}input:focus,select:focus{outline:0;border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
input.bad,select.bad{border-color:var(--rd);box-shadow:0 0 0 3px color-mix(in srgb,var(--rd) 22%,transparent)}
header{grid-area:h;background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-100%);animation:shn 6s 1s infinite}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:19px}
#brand{font-weight:800;font-size:calc(var(--fs)*1.2);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
#off{background:var(--a);color:#3a2800;border-radius:99px;padding:2px 10px;font-size:.8em;font-weight:700}#off[hidden],#inst[hidden]{display:none}
#inst{background:#fff;color:var(--c);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.87em}
nav{grid-area:n;background:var(--w);display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-right:1px solid var(--ln)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8em;font-weight:600;padding:10px 2px;border-radius:14px;color:var(--mu)}.tab b{font-size:1.45em;transition:transform .25s}
.tab.on{background:var(--g);color:#fff;box-shadow:var(--sh)}.tab.on b{transform:scale(1.15)}
main{grid-area:m;min-height:0;position:relative}.v{display:none;height:100%;overflow:auto;padding:16px}.v.on{display:block;animation:in .3s}
#v-sell.on{display:grid;grid-template-columns:1fr 380px;gap:0;overflow:hidden;padding:0}
.pane{display:flex;flex-direction:column;min-height:0;padding:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;flex-shrink:0;scrollbar-width:none}
.chip{padding:6px 16px;min-height:var(--tap);border-radius:99px;border:1px solid var(--ln);background:var(--w);white-space:nowrap;font-weight:600}.chip.on{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gw),1fr));gap:10px;overflow:auto;align-content:start;flex:1;padding:2px}
.it{background:var(--w);border:1px solid var(--ln);border-top:3px solid var(--c);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:84px;animation:pop .25s both}
.it span{color:var(--c);font-weight:700;font-size:.93em}.it.so{opacity:.5;border-top-color:var(--ln)}.it i{position:absolute;top:8px;right:10px;font-size:.75em;color:var(--rd);font-style:normal;font-weight:700}
@media(hover:hover){.it:hover{transform:translateY(-3px);box-shadow:var(--sh)}}.pop{animation:pop .3s}
.cartp{background:var(--w);border-left:1px solid var(--ln)}.grab{display:none;width:44px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 8px}
#cart{flex:1;overflow:auto}.ln{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--ln);animation:in .2s both;align-items:center}
.q{display:flex;align-items:center;gap:6px}.q button{width:var(--tap);height:var(--tap);border:1px solid var(--ln);border-radius:10px;font-weight:700;font-size:1.1em}.q input{width:64px;height:var(--tap);text-align:center;padding:4px}
.q [data-a=x]{margin-left:12px;color:var(--rd);border-color:var(--rd)}
.mu{color:var(--mu)}.tot{display:flex;justify-content:space-between;font-size:1.47em;font-weight:800;padding:10px 0}#tt{color:var(--c)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.pri,.ghost,.dng{padding:11px 14px;min-height:var(--btn);border-radius:12px;border:1px solid var(--c);font-weight:700}.pri{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}.ghost{color:var(--c)}.dng{color:var(--rd);border-color:var(--rd)}
.card{background:var(--w);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--sh);animation:in .35s both}.card h3{margin-bottom:8px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:.87em;color:var(--mu)}label input,label select{color:var(--ink);margin-top:3px}
.req{color:var(--rd)}.hint{display:block;font-size:.8em;color:var(--mu);margin-top:3px;font-weight:400}.er{color:var(--rd);font-size:.87em;margin-top:6px}.er:empty{display:none}
.ck{display:flex;align-items:center;gap:8px;font-size:1em;color:var(--ink);padding:6px 0}.ck input{width:22px;height:22px;margin:0;flex:none}
details.adv{margin:8px 0}details.adv summary{cursor:pointer;color:var(--c);font-weight:700;padding:8px 0}
.qk{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.qk button{flex:1 1 28%;min-height:var(--tap);border:1px solid var(--c);border-radius:10px;color:var(--c);font-weight:700}
.li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln);align-items:center;transition:background .2s}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.st div{background:var(--bg);border-radius:12px;padding:10px;color:var(--mu);font-size:.87em}.st b{display:block;font-size:1.27em;color:var(--ink)}.st small{display:block;font-size:.8em}
.bars{display:flex;align-items:flex-end;gap:3px;height:100px}.bars div{flex:1;background:var(--g);border-radius:4px 4px 0 0;min-height:2px;transform-origin:bottom;animation:grow .6s both}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px;min-height:var(--tap);border:1px solid var(--ln);border-radius:10px;font-weight:600}.seg .on{background:var(--g);color:#fff;border-color:transparent}
#mo{position:fixed;inset:0;background:rgba(5,20,15,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9;animation:fi .2s}#mo[hidden]{display:none}
#md{background:var(--w);border-radius:20px;padding:18px;width:100%;max-width:460px;max-height:92dvh;overflow:auto;animation:pop .25s cubic-bezier(.2,1.2,.4,1)}#md h3{margin-bottom:10px}#md label{margin-bottom:8px}
#pqr img{width:100%;max-width:260px;display:block;margin:8px auto}.pvb{text-align:center}.pvb img{max-width:100%;max-height:60dvh;border-radius:10px;box-shadow:var(--sh)}.sk{height:300px;border-radius:12px;background:linear-gradient(90deg,var(--ln),var(--bg),var(--ln));background-size:200% 100%;animation:sh 1.1s infinite}
#snk{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;width:min(520px,calc(100% - 24px));background:#12201b;color:#fff;border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;z-index:8;box-shadow:var(--sh);animation:up .3s}#snk[hidden]{display:none}#snk span{margin-right:auto;font-weight:600}#snk button{color:#7ff0c3;font-weight:700;padding:10px 6px;min-height:var(--tap)}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-10px);background:#12201b;color:#fff;padding:9px 16px;border-radius:99px;z-index:10;opacity:0;transition:.25s;pointer-events:none}#toast.on{opacity:1;transform:translateX(-50%)}
#cbar{display:none;position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--g);color:#fff;border-radius:16px;padding:15px 16px;align-items:center;gap:10px;font-weight:700;z-index:5;box-shadow:var(--sh)}
#cn{background:#fff;color:var(--c);border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 7px}#cbar span:nth-child(2){margin-right:auto}.bmp{animation:bmp .3s}
#fx{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:11}#fx.on{display:grid}#fx div{width:104px;height:104px;background:var(--c);border-radius:50%;animation:pop .45s cubic-bezier(.2,1.4,.4,1),out .3s .8s forwards;box-shadow:0 12px 40px color-mix(in srgb,var(--c) 55%,transparent)}
#fx svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}#fx circle{stroke:none}#fx path{stroke-dasharray:40;stroke-dashoffset:40;animation:dash .4s .25s forwards}
u.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none;text-decoration:none}
@keyframes in{from{opacity:0;transform:translateY(10px)}}@keyframes pop{from{opacity:0;transform:scale(.88)}}@keyframes fi{from{opacity:0}}@keyframes up{from{opacity:0;transform:translate(-50%,20px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes dash{to{stroke-dashoffset:0}}@keyframes out{to{opacity:0;transform:scale(1.25)}}@keyframes bmp{50%{transform:scale(1.05)}}@keyframes sh{to{background-position:-200% 0}}@keyframes shn{to{transform:translateX(100%)}}@keyframes rp{to{transform:scale(2.6);opacity:0}}
body.co #cbar{display:none!important}.row button{white-space:nowrap;padding-left:8px;padding-right:8px}#pv_s{flex:1.5}
#rc{display:none}
@media print{body>*:not(#rc){display:none!important}body{display:block;overflow:visible;background:#fff}#rc{display:block}#rc img{width:58mm}}
@media(min-width:1200px){#v-sell.on{grid-template-columns:1fr 420px}#grid{grid-template-columns:repeat(auto-fill,minmax(calc(var(--gw) + 20px),1fr))}.v{padding:24px 32px}}
@media(max-width:820px){
body{grid-template:"h" auto "m" minmax(0,1fr) "n" auto/1fr}
nav{flex-direction:row;border:0;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}.tab{flex:1;padding:8px 2px}.tab b{font-size:1.35em}
header{padding:8px 14px}#v-sell.on{grid-template-columns:1fr}#grid{padding-bottom:80px;grid-template-columns:repeat(auto-fill,minmax(calc(var(--gw) - 20px),1fr))}
.cartp{position:fixed;left:0;right:0;bottom:0;max-height:80dvh;border:0;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.28);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1);z-index:7;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}.cartp.open{transform:none}.grab{display:block}
#cbar.on{display:flex}#snk{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><span class="logo">🧾</span><span id="brand">Tên cửa hàng</span><span id="off" hidden>Offline</span><button id="inst" hidden>⤓ Cài app</button></header>
<nav><button class="tab on" data-v="sell"><b>🛒</b>Bán hàng</button><button class="tab" data-v="prod"><b>📦</b>Hàng hoá</button><button class="tab" data-v="rep"><b>📊</b>Đơn hàng</button><button class="tab" data-v="set"><b>⚙️</b>Cài đặt</button></nav>
<main>
<section class="v on" id="v-sell">
 <div class="pane"><div class="row" style="margin:0"><input id="q" placeholder="Tìm hàng…" type="search"><button class="ghost" id="adhoc" style="flex:none">＋ Hàng khác</button></div><div class="chips" id="chips"></div><div id="grid"></div></div>
 <div class="pane cartp" id="cartp"><div class="grab" id="grab"></div><div id="cart"></div>
  <label for="disc">Giảm giá (đ)</label>
  <div class="row" style="margin:3px 0 0"><input id="disc" inputmode="decimal" placeholder="VD: 5000"><button class="ghost" data-p="5" style="flex:none">5%</button><button class="ghost" data-p="10" style="flex:none">10%</button></div>
  <div class="tot"><span>Tổng</span><span id="tt">0đ</span></div>
  <div class="row"><button class="pri" id="quick">💵 Thu đủ</button><button class="ghost" id="pay">Thanh toán…</button></div></div>
</section>
<section class="v" id="v-prod"><div class="row" style="margin:0 0 10px"><input id="pq" type="search" placeholder="Tìm hàng hoá…"><button class="pri" style="flex:none" id="padd">+ Thêm</button></div><div class="card" id="plist"></div></section>
<section class="v" id="v-rep"><div class="card"><div class="seg" id="rg"></div></div><div class="card"><div class="st" id="stats"></div><div class="bars" id="bars" style="margin-top:12px"></div></div><div class="card"><h3>Bán chạy</h3><div id="top"></div></div><div class="card"><h3>Đơn hàng</h3><div id="olist"></div></div></section>
<section class="v" id="v-set"><div class="card" id="cfgc"></div><div class="card" id="uic"></div><div class="card" id="datac"></div></section>
</main>
<button id="cbar"><span id="cn">0</span><span>Xem giỏ hàng</span><b id="cb">0đ</b></button><div id="fx"></div><div id="snk" hidden></div><div id="mo" hidden><div id="md"></div></div><div id="toast"></div><div id="rc"></div>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n||0).toLocaleString('vi-VN');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim();
const num=v=>{let s=String(v??'').replace(/[^\d.,-]/g,'');if(!s)return NaN;if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else if(/^-?\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');return parseFloat(s)};
const dk=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const tm=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())};
const DEF=()=>({cfg:{name:'',phone:'',addr:'',foot:'',pre:'',color:'#0f9d76',bin:'',bank:'',acc:'',holder:'',round:1000,big:0,vib:1,snd:0,awake:0},products:[],orders:[],counter:0,lastBackup:0});
let S=DEF(),DBH=null,cart={},AD={},G='',Q='',R='today',last=null,hs;
/* ---- lưu trữ: IndexedDB, toàn bộ dữ liệu nằm trên máy ---- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('ban-hang-local',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function load(){try{DBH=await idb();const v=await new Promise(r=>{const q=DBH.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v)S=Object.assign(DEF(),v,{cfg:Object.assign(DEF().cfg,v.cfg)})}catch(e){DBH=null;toast('Trình duyệt không cho lưu dữ liệu — hãy xuất file sao lưu thường xuyên')}}
function save(){if(DBH)try{DBH.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'s')}catch(e){toast('Không lưu được dữ liệu',1)}}
/* ---- phản hồi: rung, âm báo ---- */
const hap=k=>{if(S.cfg.vib&&navigator.vibrate)try{navigator.vibrate(k==='tap'?18:k==='ok'?[30,40,30]:[25,60,25])}catch(e){}};
let AC=null;
function beep(k){if(!S.cfg.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=k==='ok'?880:k==='err'?220:660;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(k==='ok'?.16:.07))}catch(e){}}
const fb=k=>{hap(k);beep(k)};
function toast(m,e){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(hs);hs=setTimeout(()=>t.classList.remove('on'),2200);if(e)fb('err')}
function bad(id,eid,msg){const el=$('#'+id);el.classList.add('bad');if(eid)$('#'+eid).textContent=msg;else toast(msg,1);el.focus();fb('err');el.addEventListener('input',()=>{el.classList.remove('bad');if(eid)$('#'+eid).textContent=''},{once:true})}
let WL=null;
async function wake(){try{if(S.cfg.awake&&navigator.wakeLock&&document.visibilityState==='visible'&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}else if(!S.cfg.awake&&WL){await WL.release();WL=null}}catch(e){}}
document.addEventListener('visibilitychange',wake);
function modal(h){$('#md').innerHTML=h;$('#mo').hidden=false}function closeM(){$('#mo').hidden=true}
$('#mo').onclick=e=>{if(e.target.id==='mo')closeM()};
const price=p=>p.sp>0&&p.sp<p.p?p.sp:p.p;
const roundTo=v=>{const s=S.cfg.round>0?S.cfg.round:1;return Math.round(v/s)*s};
function applyCfg(){document.documentElement.style.setProperty('--c',S.cfg.color||'#0f9d76');document.documentElement.dataset.z=S.cfg.big||0;$('#brand').textContent=S.cfg.name||'Tên cửa hàng';wake()}
function go(v){$$('.v').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));$$('.tab').forEach(e=>e.classList.toggle('on',e.dataset.v===v));({sell:rSell,prod:rProd,rep:rRep,set:rSet})[v]()}
$$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));
/* ---- giỏ hàng dở dang: giữ lại khi tải lại trang ---- */
function pc(){try{if(Object.keys(cart).length)localStorage.setItem('cch-cart',JSON.stringify({c:cart,a:AD,d:$('#disc').value}));else localStorage.removeItem('cch-cart')}catch(e){}}
function restoreCart(){try{const d=JSON.parse(localStorage.getItem('cch-cart')||'null');if(d&&d.c){cart=d.c;AD=d.a||{};$('#disc').value=d.d||''}}catch(e){}}
/* ---- bán hàng ---- */
